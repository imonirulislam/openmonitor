services:
  postgres:
    image: postgres:17-alpine
    container_name: open-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openmonitor
      POSTGRES_PASSWORD: openmonitor
      POSTGRES_DB: open_monitor
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmonitor -d open_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Holds monitor_runs — the only table that grows with time. Measured on real
  # data a probe result costs ~2 bytes here against ~326 in Postgres, which is
  # what makes 90 days of history across several regions fit in a free-tier
  # database. Everything relational stays in Postgres.
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: open-monitor-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "5435:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # 127.0.0.1, not localhost: inside the container that resolves to ::1
      # first and the server only binds IPv4 here, so the check would fail
      # against a server that is up and serving.
      test: ["CMD-SHELL", "wget -qO- 127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Browser for ClickHouse — tables, ad-hoc SQL, storage per column.
  #
  #   docker compose --profile tools up -d ch-ui   →  http://localhost:5436
  #
  # On first run, add a connection pointing at http://clickhouse:8123 (user
  # `default`, no password). It keeps that in its own state, so this is once
  # per volume — it ignores the env vars its README suggests.
  #
  # Dev only, hence the profile: it is an unauthenticated query console and
  # has no business being reachable from a deployment.
  ch-ui:
    profiles: ["tools"]
    image: ghcr.io/caioricciuti/ch-ui:latest
    container_name: open-monitor-ch-ui
    restart: unless-stopped
    ports:
      - "5436:3488"
    depends_on:
      clickhouse:
        condition: service_healthy

  # Neon's WebSocket-to-TCP shim. @neondatabase/serverless only speaks the
  # Postgres protocol over a WebSocket, which plain Postgres can't terminate;
  # this unwraps it. Production talks to Neon directly and leaves NEON_WS_PROXY
  # unset, so the only difference between here and there is one env var.
  wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    container_name: open-monitor-wsproxy
    restart: unless-stopped
    environment:
      APPEND_PORT: "postgres:5432"
      ALLOW_ADDR_REGEX: ".*"
    # Published so `bun run dev` on the host reaches it too, the same way it
    # reaches Postgres on 5433.
    ports:
      - "5434:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Applies migrations and installs the notify_monitor_changed() trigger function,
  # then exits. Every service that reads the schema waits for this to complete, so
  # `docker compose up` works on an empty volume with no manual step. Reuses the
  # api image because it already carries packages/db, its migrations, and tsx.
  migrate:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    container_name: open-monitor-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://openmonitor:openmonitor@postgres:5432/open_monitor
      NEON_WS_PROXY: wsproxy:80
      CLICKHOUSE_URL: http://clickhouse:8123
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      wsproxy:
        condition: service_started
    working_dir: /repo
    # Both stores. Postgres runs its numbered migration chain; ClickHouse has a
    # single append-only table applied with CREATE IF NOT EXISTS.
    command:
      - sh
      - -c
      - |
        cd /repo/packages/db && node_modules/.bin/tsx src/migrate.ts
        cd /repo/packages/clickhouse && node_modules/.bin/tsx src/migrate.ts

  # Demo data — opt in with: docker compose --profile seed up seed
  # Kept out of the default `up` so a real deployment never gets a known-password
  # admin user or example monitors.
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    container_name: open-monitor-seed
    restart: "no"
    environment:
      DATABASE_URL: postgres://openmonitor:openmonitor@postgres:5432/open_monitor
      NEON_WS_PROXY: wsproxy:80
      CLICKHOUSE_URL: http://clickhouse:8123
      PROBE_TOKEN: ${PROBE_TOKEN:-omp_dev_local_change_me}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    working_dir: /repo/packages/db
    command: ["node_modules/.bin/tsx", "src/seed.ts"]

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    container_name: open-monitor-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://openmonitor:openmonitor@postgres:5432/open_monitor
      NEON_WS_PROXY: wsproxy:80
      CLICKHOUSE_URL: http://clickhouse:8123
      PROBE_API_KEY: ${PROBE_API_KEY:-change-me-probe-key}
      CRON_SECRET: ${CRON_SECRET:-change-me-cron-secret-32-chars-min}
      PORT: "5002"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      wsproxy:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "5002:5002"

  notifier:
    build:
      context: .
      dockerfile: deploy/docker/notifier.Dockerfile
    container_name: open-monitor-notifier
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://openmonitor:openmonitor@postgres:5432/open_monitor
      NEON_WS_PROXY: wsproxy:80
      CLICKHOUSE_URL: http://clickhouse:8123
      NODE_ENV: production
      PORT: "5004"
      # Container deployment: this process paces itself. Set to "off" and drive
      # /cron/drain + /cron/sweep externally when running serverless.
      NOTIFIER_POLL: "${NOTIFIER_POLL:-on}"
      CRON_SECRET: ${CRON_SECRET:-change-me-cron-secret-32-chars-min}
      POLL_INTERVAL_MS: "5000"
      HEARTBEAT_SWEEP_MS: "${HEARTBEAT_SWEEP_MS:-30000}"
      LOCATION_SILENT_GRACE_SECONDS: "${LOCATION_SILENT_GRACE_SECONDS:-60}"
    ports:
      - "5004:5004"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      wsproxy:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    container_name: open-monitor-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://openmonitor:openmonitor@postgres:5432/open_monitor
      NEON_WS_PROXY: wsproxy:80
      CLICKHOUSE_URL: http://clickhouse:8123
      # Who may manage shared probe locations. Empty means nobody.
      OPERATOR_EMAILS: ${OPERATOR_EMAILS-admin@openmonitor.local}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-to-a-32-byte-random-secret}
      AUTH_URL: http://localhost:5001
      API_URL: http://api:5002
      PROBE_API_KEY: ${PROBE_API_KEY:-change-me-probe-key}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      wsproxy:
        condition: service_started
      api:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "5001:5001"

  status-page:
    build:
      context: .
      dockerfile: deploy/docker/status-page.Dockerfile
    container_name: open-monitor-page
    restart: unless-stopped
    environment:
      API_URL: http://api:5002
      NEXT_PUBLIC_API_URL: http://localhost:5002
      NEXT_PUBLIC_STATUS_TITLE: OpenMonitor
      NEXT_PUBLIC_STATUS_DESCRIPTION: Live status for your services
      NODE_ENV: production
    depends_on:
      api:
        condition: service_started
    ports:
      - "5003:5003"

  checker:
    build:
      context: .
      dockerfile: deploy/docker/checker.Dockerfile
    container_name: open-monitor-checker
    restart: unless-stopped
    environment:
      API_URL: http://api:5002
      PROBE_TOKEN: ${PROBE_TOKEN:-omp_dev_local_change_me}
      CHECKER_DEFAULT_TIMEOUT_MS: "10000"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      wsproxy:
        condition: service_started
      api:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # Extra region for exercising multi-region aggregation locally. Probes the same
  # targets from the same host, so latencies are similar — it's the per-region
  # bookkeeping and reduction being tested, not real geography.
  checker-eu-west:
    profiles: ["multi-region"]
    build:
      context: .
      dockerfile: deploy/docker/checker.Dockerfile
    container_name: open-monitor-checker-eu-west
    restart: unless-stopped
    environment:
      # No DATABASE_URL: remote regions have no database access, so this also
      # exercises the LISTEN/NOTIFY-less polling path.
      API_URL: http://api:5002
      PROBE_TOKEN: omp_dev_eu_west_change_me
      CHECKER_DEFAULT_TIMEOUT_MS: "10000"
    depends_on:
      api:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # Extra region for exercising multi-region aggregation locally. Probes the same
  # targets from the same host, so latencies are similar — it's the per-region
  # bookkeeping and reduction being tested, not real geography.
  checker-us-east:
    profiles: ["multi-region"]
    build:
      context: .
      dockerfile: deploy/docker/checker.Dockerfile
    container_name: open-monitor-checker-us-east
    restart: unless-stopped
    environment:
      # No DATABASE_URL: remote regions have no database access, so this also
      # exercises the LISTEN/NOTIFY-less polling path.
      API_URL: http://api:5002
      PROBE_TOKEN: omp_dev_us_east_change_me
      CHECKER_DEFAULT_TIMEOUT_MS: "10000"
    depends_on:
      api:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # Extra region for exercising multi-region aggregation locally. Probes the same
  # targets from the same host, so latencies are similar — it's the per-region
  # bookkeeping and reduction being tested, not real geography.
  checker-ap-south:
    profiles: ["multi-region"]
    build:
      context: .
      dockerfile: deploy/docker/checker.Dockerfile
    container_name: open-monitor-checker-ap-south
    restart: unless-stopped
    environment:
      # No DATABASE_URL: remote regions have no database access, so this also
      # exercises the LISTEN/NOTIFY-less polling path.
      API_URL: http://api:5002
      PROBE_TOKEN: omp_dev_ap_south_change_me
      CHECKER_DEFAULT_TIMEOUT_MS: "10000"
    depends_on:
      api:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # Extra region for exercising multi-region aggregation locally. Probes the same
  # targets from the same host, so latencies are similar — it's the per-region
  # bookkeeping and reduction being tested, not real geography.
  checker-sa-east:
    profiles: ["multi-region"]
    build:
      context: .
      dockerfile: deploy/docker/checker.Dockerfile
    container_name: open-monitor-checker-sa-east
    restart: unless-stopped
