name: CI

# No push trigger: deploy.yml calls this on main, so a push trigger would run
# every check twice and — sharing a concurrency group with the reusable call —
# one run would cancel the other. That killed a deploy mid-flight.
on:
  pull_request:
  workflow_call:

concurrency:
  # Scoped by workflow as well as ref, so a caller's run and a standalone run
  # can never contend even if a trigger is added back.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # lint:types is deliberately not a gate — it's informational and exits 0
      # even when it finds things. See CONTRIBUTING.md.

  checker:
    name: go build · vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/checker/go.mod
          cache-dependency-path: apps/checker/go.sum
      - run: go build ./...
        working-directory: apps/checker
      - run: go vet ./...
        working-directory: apps/checker
