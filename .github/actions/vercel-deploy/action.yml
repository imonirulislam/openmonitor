name: Deploy to Vercel
description: Build and deploy one app in this monorepo to a Vercel project.

inputs:
  app:
    description: Directory under apps/ — also the Root Directory of the Vercel project.
    required: true
  project-id:
    description: VERCEL_PROJECT_ID for this app. Each app is its own Vercel project.
    required: true
  org-id:
    required: true
  token:
    required: true

runs:
  using: composite
  steps:
    # The whole repo is checked out and installed from the root, because the
    # apps import workspace packages. `vercel build` then runs its own install —
    # each vercel.json sets installCommand to `cd ../..` for the same reason.
    #
    # The token goes through the environment rather than --token, so it stays
    # out of argv and out of the interpolated command line.
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - run: bun install --frozen-lockfile
      shell: bash

    - name: Pull project settings
      shell: bash
      working-directory: apps/${{ inputs.app }}
      env:
        VERCEL_ORG_ID: ${{ inputs.org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.project-id }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: bunx vercel@latest pull --yes --environment=production

    # Build here rather than on Vercel, then upload the output. Keeps the build
    # on the same runner that just passed CI, and means the deploy step is a
    # file upload that either works or doesn't.
    - name: Build
      shell: bash
      working-directory: apps/${{ inputs.app }}
      env:
        VERCEL_ORG_ID: ${{ inputs.org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.project-id }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: bunx vercel@latest build --prod

    - name: Deploy
      shell: bash
      working-directory: apps/${{ inputs.app }}
      env:
        VERCEL_ORG_ID: ${{ inputs.org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.project-id }}
        VERCEL_TOKEN: ${{ inputs.token }}
      run: bunx vercel@latest deploy --prebuilt --prod
