# fly.toml app configuration file generated for openmonitor-checker-cdg on 2026-09-14T20:41:51+06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'openmonitor-checker-cdg'
primary_region = 'cdg'

[build]
  dockerfile = '../docker/checker.Dockerfile'

[env]
  API_URL = 'https://api.openmonitor.app'
  CHECKER_DEFAULT_TIMEOUT_MS = '10000'

[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
