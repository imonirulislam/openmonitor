# The one VM: ClickHouse, notifier and a checker.
#
# Postgres is Neon and the web apps are on Vercel, so neither is here. Run from
# a clone of the repo on the VM:
#
#   cp deploy/vm/.env.example deploy/vm/.env   # fill it in
#   docker compose -f deploy/vm/docker-compose.yml --env-file deploy/vm/.env up -d --build
#
# Co-location is deliberate: it keeps the box busy enough to survive Oracle's
# idle reclamation, and NOTIFIER_POLL=on means no external scheduler.

name: openmonitor-vm

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    # ClickHouse sizes itself to the host and would take ~90% of RAM. It reads
    # the cgroup limit, so capping the container is enough to leave room for the
    # notifier, the checker and the OS on a 12 GB box.
    mem_limit: 6g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ClickHouse browser. Bound to loopback, so it is not reachable from the
  # internet — get to it over an SSH tunnel:
  #
  #   ssh -L 5436:127.0.0.1:5436 user@your-vm    then http://localhost:5436
  #
  # Loopback only, reached over an SSH tunnel. To publish it, copy
  # conf.d/chui.caddy.example — that vhost puts Caddy's basic auth in front,
  # which matters because ch-ui's sign-in is a ClickHouse connection test rather
  # than an account check.
  ch-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    restart: unless-stopped
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CONNECTION_NAME: OpenMonitor
    ports:
      - "127.0.0.1:5436:3488"
    mem_limit: 256m
    depends_on:
      clickhouse: { condition: service_healthy }

  # TLS for ClickHouse. Vercel functions have no stable egress IP on Hobby, so
  # an IP allowlist isn't available and 8123 would otherwise be open to the
  # internet with the password sent as plaintext HTTP Basic. Caddy gets a
  # Let's Encrypt certificate for CLICKHOUSE_HOSTNAME automatically.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOSTNAME: ${CLICKHOUSE_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./conf.d:/etc/caddy/conf.d:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      clickhouse: { condition: service_healthy }
      ch-ui: { condition: service_started }

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      RETENTION_RUN_DAYS: ${RETENTION_RUN_DAYS:-180}
    depends_on:
      clickhouse: { condition: service_healthy }
    working_dir: /repo
    command:
      - sh
      - -c
      - |
        cd /repo/packages/db && /repo/node_modules/.bin/tsx src/migrate.ts
        cd /repo/packages/clickhouse && /repo/node_modules/.bin/tsx src/migrate.ts

  notifier:
    build:
      context: ../..
      dockerfile: deploy/docker/notifier.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # No NEON_WS_PROXY: Neon terminates the WebSocket itself. The proxy is a
      # local-development shim for plain Postgres.
      NODE_ENV: production
      # Self-pacing, so there is no cron to configure.
      NOTIFIER_POLL: "on"
      SLACK_DEFAULT_WEBHOOK_URL: ${SLACK_DEFAULT_WEBHOOK_URL:-}
    mem_limit: 512m
    depends_on:
      migrate: { condition: service_completed_successfully }

  checker:
    build:
      context: ../..
      dockerfile: deploy/docker/checker.Dockerfile
    restart: unless-stopped
    environment:
      # The public API on Vercel. No DATABASE_URL — probes reach the database
      # only through it, so this box holds no Postgres credentials for them.
      API_URL: ${API_URL}
      PROBE_TOKEN: ${PROBE_TOKEN}
      CHECKER_DEFAULT_TIMEOUT_MS: "10000"
    mem_limit: 256m

volumes:
  clickhouse-data:
  caddy-data:
  caddy-config:
