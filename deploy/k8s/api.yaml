apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: open-monitor
  labels: { app: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          # TODO: replace with your registry path
          image: REGISTRY/open-monitor-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - { name: PORT, value: "5002" }
            - { name: NODE_ENV, value: production }
          envFrom:
            - secretRef: { name: open-monitor-secrets }
          readinessProbe:
            httpGet: { path: /ready, port: 5002 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5002 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: open-monitor
spec:
  selector: { app: api }
  ports:
    - port: 80
      targetPort: 5002
