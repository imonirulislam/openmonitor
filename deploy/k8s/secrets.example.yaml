# Example only — DO NOT commit real secrets.
# Apply this with `sops`/`SealedSecrets`/`ExternalSecrets` in your cluster.
apiVersion: v1
kind: Secret
metadata:
  name: open-monitor-secrets
  namespace: open-monitor
type: Opaque
stringData:
  # TODO: replace with your RDS / Aurora connection string
  DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/open_monitor"
  # TODO: openssl rand -base64 32
  AUTH_SECRET: "REPLACE_WITH_32_BYTE_SECRET"
  # TODO: openssl rand -hex 32
  # Operational endpoints (/v1/system/*), used by the admin System status page.
  PROBE_API_KEY: "REPLACE_WITH_PROBE_KEY"
  # Probe-location token. Mint one PER REGION and give each checker only its own;
  # the server derives the region from it. Never reuse one across locations.
  PROBE_TOKEN: "REPLACE_WITH_PROBE_LOCATION_TOKEN"
